name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
          node --check lib/find-dota.mjs

      # 冒烟测试（宿主半路由与账号换算）+ 内置动作帧完整性，后者自动遍历所有英雄
      - name: 测试
        run: node --test

      - name: 校验 package.json 的 dsh 字段与 files 列表
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const patch = p.dsh && p.dsh.bundle && p.dsh.bundle.patch;
          if (!patch || !fs.existsSync(patch)) throw new Error('dsh.bundle.patch 缺失');
          if (!p.dsh.client || p.dsh.client.platform !== 'web') throw new Error('dsh.client 配置缺失');
          for (const f of p.files || []) if (!fs.existsSync(f)) throw new Error('files 里列了不存在的路径 - ' + f);
          console.log('package.json OK');
          "