name: Release

# 打 vX.Y.Z 标签即发布：先跑与 CI 相同的检查，再校验标签与 package.json 版本一致，
# 然后发 npm（带 provenance 溯源）并创建 GitHub Release。
#
# npm 发布需要仓库 Secrets 里的 NPM_TOKEN；没配置时会**跳过发布**并在日志里给出提示，
# 不会把这次标签推送标记成失败（GitHub Release 仍会创建）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 检查与测试（含全部内置英雄的帧完整性）
        run: |
          npm run check
          npm test

      - name: 标签与 package.json 版本必须一致
        run: |
          node -e "const v=require('./package.json').version;const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){throw new Error('tag '+t+' != package.json '+v)};console.log('version '+v+' OK')"

      - name: 是否配置了 NPM_TOKEN
        id: npm
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN 已配置，将发布到 npm"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 NPM_TOKEN，跳过 npm 发布；如需自动发布，请在仓库 Secrets 里添加 NPM_TOKEN"
          fi

      - name: 发布到 npm
        if: steps.npm.outputs.has == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            发布流程见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
            安装：`pnpm add dsh-dota2-pet`